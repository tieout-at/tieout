# Prüfungen für den Zuruf-Agenten (product/zuruf): Typen und Tests ohne KI. Läuft nur, wenn sich dort etwas ändert.
# Die App (produkt-app.yml) bindet aus product/zuruf nur Typen ein und braucht diesen Job nicht.
name: Zuruf-Agent

on:
  pull_request:
    paths: ["product/zuruf/**", ".github/workflows/produkt-zuruf.yml"]
  push:
    branches: [main]
    paths: ["product/zuruf/**"]

concurrency:
  group: produkt-zuruf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zuruf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product/zuruf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/zuruf/package-lock.json
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Tests
        run: npm test
