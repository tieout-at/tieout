# Prüfungen für product/app bei jedem Pull Request und jedem Push auf main.
# Der Job-Name „pruefen“ ist als Pflichtprüfung für main eingetragen: nicht umbenennen.
name: Produkt-App

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: produkt-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/app/package-lock.json
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
