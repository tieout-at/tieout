# Prüfungen für den WhatsApp-Agenten (product/whatsapp): Typen und Tests ohne KI. Läuft nur, wenn sich dort etwas ändert.
# Die App (produkt-app.yml) bindet aus product/whatsapp nur Typen ein und braucht diesen Job nicht.
name: WhatsApp-Agent

on:
  pull_request:
    paths: ["product/whatsapp/**", ".github/workflows/produkt-whatsapp.yml"]
  push:
    branches: [main]
    paths: ["product/whatsapp/**"]

concurrency:
  group: produkt-whatsapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/whatsapp/package-lock.json
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Tests
        run: npm test
