# Checks for the solution list: every amount recomputed, every date a working day, amount audit of the specification.
name: Lösungsliste

on:
  pull_request:
    paths: ["docs/Demo_Faelle.md", "docs/SPEZIFIKATION.md", "docs/demo_faelle_check.mjs", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/Demo_Faelle.md", "docs/SPEZIFIKATION.md", "docs/demo_faelle_check.mjs"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loesungsliste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Beträge nachrechnen
        run: node docs/demo_faelle_check.mjs
