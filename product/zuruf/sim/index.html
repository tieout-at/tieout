<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuruf-Simulator</title>
<style>
  :root {
    --kopf: #008069; --kopf-text: #fff; --chat: #efeae2; --muster: rgba(0,0,0,.035);
    --ich: #d9fdd3; --er: #ffffff; --text: #111b21; --leise: #667781; --haken: #53bdeb;
    --akzent: #00a884; --knopf-text: #008069; --leiste: #f0f2f5; --feld: #ffffff; --rand: #e9edef;
    --panel: #ffffff; --seite: #d1d7db; --warn: #a15c00; --schatten: 0 1px .5px rgba(11,20,26,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --kopf: #202c33; --kopf-text: #e9edef; --chat: #0b141a; --muster: rgba(255,255,255,.025);
      --ich: #005c4b; --er: #202c33; --text: #e9edef; --leise: #8696a0; --knopf-text: #00a884;
      --leiste: #202c33; --feld: #2a3942; --rand: #2a3942; --panel: #111b21; --seite: #0c1317; --warn: #8a5300;
    }
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; font: 14.2px/1.4 "Segoe UI", Helvetica, Arial, system-ui, sans-serif; color: var(--text); background: var(--seite); }
  .hinweis { background: var(--warn); color: #fff; text-align: center; font-size: 12px; padding: 4px 16px; }
  main { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; height: calc(100vh - 24px); max-width: 1400px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); height: auto; } .chat { height: 85vh; } }

  .chat { display: flex; flex-direction: column; min-height: 0; background-color: var(--chat);
    background-image: radial-gradient(var(--muster) 1.2px, transparent 1.3px), radial-gradient(var(--muster) 1.2px, transparent 1.3px);
    background-size: 22px 22px; background-position: 0 0, 11px 11px; border-right: 1px solid var(--rand); }
  .kopf { background: var(--kopf); color: var(--kopf-text); padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bild { width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; color: #8696a0; display: grid; place-items: center; flex: none; }
  .wer { flex: 1; min-width: 0; }
  .wer strong { display: block; font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wer small { opacity: .8; font-size: 12.5px; }
  .kopf select, .kopf button { font: inherit; font-size: 12.5px; background: transparent; color: var(--kopf-text); border: 1px solid rgba(255,255,255,.35); border-radius: 14px; padding: 3px 8px; cursor: pointer; }
  .kopf select option { color: #111b21; }

  #verlauf { flex: 1; overflow-y: auto; padding: 14px 6% 8px; display: flex; flex-direction: column; gap: 3px; }
  .tag { align-self: center; background: var(--er); color: var(--leise); font-size: 12px; padding: 5px 12px; border-radius: 8px; box-shadow: var(--schatten); margin: 6px 0 10px; text-transform: uppercase; }
  .blase { position: relative; max-width: 82%; padding: 6px 7px 8px 9px; border-radius: 7.5px; white-space: pre-wrap; word-wrap: break-word; box-shadow: var(--schatten); margin-top: 6px; }
  .blase.ich { align-self: flex-end; background: var(--ich); border-top-right-radius: 0; }
  .blase.er { align-self: flex-start; background: var(--er); border-top-left-radius: 0; }
  .blase.ich::before, .blase.er::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
  .blase.ich::before { right: -8px; background: var(--ich); clip-path: polygon(0 0, 100% 0, 0 100%); }
  .blase.er::before { left: -8px; background: var(--er); clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .blase.folge { margin-top: 2px; border-radius: 7.5px; }
  .blase.folge::before { display: none; }
  .meta { float: right; margin: 6px 0 -4px 10px; font-size: 11px; color: var(--leise); display: inline-flex; align-items: center; gap: 3px; }
  .meta svg { color: var(--haken); }
  .art { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--leise); margin-bottom: 3px; }
  .sprache { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--leise); }
  .welle { height: 18px; flex: 1; min-width: 90px; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px); opacity: .45;
    -webkit-mask: linear-gradient(0deg, #000 30%, transparent 30% 35%, #000 35%) ; border-radius: 2px; }
  .knoepfe { align-self: flex-start; width: min(82%, 300px); margin-top: 2px; display: flex; flex-direction: column; gap: 2px; }
  .knoepfe button { background: var(--er); color: var(--knopf-text); border: 0; border-radius: 7.5px; padding: 9px; font: inherit; font-weight: 500; cursor: pointer; box-shadow: var(--schatten); }
  .knoepfe button:hover:not(:disabled) { filter: brightness(.97); }
  .knoepfe button:disabled { opacity: .55; cursor: default; }
  .tippt { align-self: flex-start; background: var(--er); border-radius: 7.5px; padding: 8px 12px; box-shadow: var(--schatten); margin-top: 6px; display: none; gap: 4px; }
  .tippt.an { display: inline-flex; }
  .tippt i { width: 7px; height: 7px; border-radius: 50%; background: var(--leise); animation: hops 1.2s infinite; }
  .tippt i:nth-child(2) { animation-delay: .2s; } .tippt i:nth-child(3) { animation-delay: .4s; }
  @keyframes hops { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  form { display: flex; gap: 8px; padding: 6px 10px 8px; background: var(--leiste); align-items: flex-end; }
  .eingabe { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: var(--feld); border-radius: 22px; padding: 4px 6px 4px 4px; }
  .eingabe input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; padding: 7px 4px; }
  .art-wahl { display: flex; }
  .art-wahl button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--leise); cursor: pointer; display: grid; place-items: center; }
  .art-wahl button[aria-pressed="true"] { color: var(--akzent); background: rgba(0,168,132,.12); }
  .senden { width: 46px; height: 46px; flex: none; border: 0; border-radius: 50%; background: var(--akzent); color: #fff; cursor: pointer; display: grid; place-items: center; box-shadow: var(--schatten); }
  .senden:active { transform: scale(.94); }

  .buero { padding: 20px 24px; overflow-y: auto; min-height: 0; background: var(--panel); }
  .buero h2 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  .buero p.leise { color: var(--leise); margin: 0 0 16px; font-size: 13px; }
  .karte { border: 1px solid var(--rand); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: var(--panel); }
  .karte .zeile { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 14px; padding: 3px 0; }
  .karte .zeile > span:first-child { color: var(--leise); }
  .karte .zitat { color: var(--leise); font-size: 12px; font-style: italic; }
  .marken { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .marke { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--leiste); color: var(--leise); }
  .marke.ok { background: rgba(0,168,132,.15); color: var(--knopf-text); }
  .marke.offen { background: rgba(161,92,0,.14); color: var(--warn); }
  .quelle { margin-top: 8px; font-size: 12px; color: var(--leise); border-top: 1px dashed var(--rand); padding-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="hinweis">Simulator · synthetische Daten · fiktive Firma · keine echte WhatsApp-Nummer</div>
<main>
  <section class="chat" aria-label="Chat">
    <div class="kopf">
      <div class="bild" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg></div>
      <div class="wer"><strong>Zuruf · Haustechnik Beispiel</strong><small id="status">Assistent der Firma (Programm)</small></div>
      <select id="absender" aria-label="Absender">
        <option value="sim-monteur|monteur">als Monteur</option>
        <option value="sim-polier|polier">als Polier</option>
        <option value="sim-neu|monteur">als neue Person</option>
      </select>
      <button id="reset" type="button" title="Alles zurücksetzen">Neu</button>
    </div>
    <div id="verlauf"><div class="tag">Heute</div></div>
    <form id="form">
      <div class="eingabe">
        <div class="art-wahl" role="group" aria-label="Art der Nachricht">
          <button type="button" data-art="sprache" aria-pressed="true" title="Sprachnachricht (Transkript tippen)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2Z"/></svg></button>
          <button type="button" data-art="foto" aria-pressed="false" title="Foto (beschreiben, was zu sehen ist)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg></button>
          <button type="button" data-art="text" aria-pressed="false" title="Textnachricht"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg></button>
        </div>
        <input id="eingabe" autocomplete="off" placeholder="Was du sagen würdest …">
      </div>
      <button class="senden" aria-label="Senden"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg></button>
    </form>
  </section>
  <section class="buero" aria-label="Büro-Ansicht">
    <h2>Was das Büro sieht</h2>
    <p class="leise">Jede Angabe mit Zitat aus der Nachricht. Nichts wird überschrieben, Korrekturen sind neue Versionen. Keine Auswertung pro Person.</p>
    <div id="liste"></div>
    <p class="leise" id="kosten"></p>
  </section>
</main>
<script>
const verlauf = document.getElementById("verlauf");
const eingabe = document.getElementById("eingabe");
const status = document.getElementById("status");
const absenderWahl = document.getElementById("absender");
const platzhalter = { sprache: "Was du sagen würdest …", text: "Nachricht", foto: "Was ist auf dem Foto zu sehen?" };
let art = "sprache";
document.querySelectorAll(".art-wahl button").forEach((b) =>
  b.addEventListener("click", () => {
    art = b.dataset.art;
    document.querySelectorAll(".art-wahl button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    eingabe.placeholder = platzhalter[art];
    eingabe.focus();
  }),
);
const absender = () => { const [id, rolle] = absenderWahl.value.split("|"); return { absenderId: id, rolle }; };
const projekte = {};
fetch("/firma").then((r) => r.json()).then((f) => f.projekte.forEach((p) => (projekte[p.id] = p.kurz)));

const uhr = () => new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
const HAKEN = '<svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M11.1.6 4.9 6.8 2.4 4.3 1.3 5.4l3.6 3.6 7.3-7.3zM15 .6 8.8 6.8l-.8-.8-1.1 1.1 1.9 1.9 7.3-7.3z"/></svg>';
let letzter = "";

function blase(text, wer, artName) {
  const d = document.createElement("div");
  d.className = "blase " + wer + (letzter === wer ? " folge" : "");
  letzter = wer;
  if (artName === "sprache") {
    const s = document.createElement("div");
    s.className = "sprache";
    s.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="welle"></span><span>0:0' + (3 + (text.length % 7)) + "</span>";
    d.append(s);
  } else if (artName === "foto" || artName === "knopf") {
    const s = document.createElement("div");
    s.className = "art";
    s.textContent = artName === "foto" ? "Foto" : "Antwort per Knopf";
    d.append(s);
  }
  d.append(document.createTextNode(text));
  const m = document.createElement("span");
  m.className = "meta";
  m.innerHTML = uhr() + (wer === "ich" ? " " + HAKEN : "");
  d.append(m);
  verlauf.insertBefore(d, tippt);
  verlauf.scrollTop = verlauf.scrollHeight;
}

const tippt = document.createElement("div");
tippt.className = "tippt";
tippt.innerHTML = "<i></i><i></i><i></i>";
verlauf.append(tippt);

function knoepfe(liste) {
  const box = document.createElement("div");
  box.className = "knoepfe";
  for (const k of liste) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = k.titel;
    b.onclick = () => { box.querySelectorAll("button").forEach((x) => (x.disabled = true)); senden({ art: "knopf", inhalt: k.titel, knopfId: k.id }); };
    box.append(b);
  }
  verlauf.insertBefore(box, tippt);
  letzter = "";
  verlauf.scrollTop = verlauf.scrollHeight;
}

async function senden(n) {
  blase(n.inhalt, "ich", n.art);
  tippt.classList.add("an");
  status.textContent = "schreibt …";
  verlauf.scrollTop = verlauf.scrollHeight;
  try {
    const r = await fetch("/nachricht", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...n, ...absender() }) });
    const d = await r.json();
    if (d.fehler) blase("Fehler: " + d.fehler, "er");
    for (const a of d.antworten ?? []) {
      blase(a.text, "er");
      if (a.knoepfe) knoepfe(a.knoepfe);
      if (a.liste) knoepfe(a.liste.eintraege);
    }
  } finally {
    tippt.classList.remove("an");
    status.textContent = "Assistent der Firma (Programm)";
    ladeBuero();
  }
}

document.getElementById("form").onsubmit = (e) => {
  e.preventDefault();
  const t = eingabe.value.trim();
  if (!t) return;
  eingabe.value = "";
  senden({ art, inhalt: t });
};
function leeren() {
  verlauf.innerHTML = '<div class="tag">Heute</div>';
  verlauf.append(tippt);
  letzter = "";
}
document.getElementById("reset").onclick = async () => {
  await fetch("/zuruecksetzen", { method: "POST" });
  leeren();
  ladeBuero();
};
absenderWahl.onchange = leeren;

const namen = { projektId: "Baustelle", ort: "Ort", leistung: "Arbeit", menge: "Menge", personen: "Leute", dauerStunden: "Stunden", angewiesenVon: "Angeschafft", datum: "Tag", material: "Material", grund: "Grund" };
const offenNamen = { projektId: "Baustelle", leistung: "Arbeit", ort: "Ort", angewiesenVon: "wer angeschafft hat", personen: "Leute", dauerStunden: "Stunden", menge: "Menge", datum: "Tag" };
const statusNamen = { bestaetigt: "bestätigt", unbestaetigt: "unbestätigt", zurueckgezogen: "zurückgezogen" };

function marke(text, klasse = "") {
  const s = document.createElement("span");
  s.className = "marke " + klasse;
  s.textContent = text;
  return s;
}

async function ladeBuero() {
  const d = await (await fetch("/ereignisse")).json();
  const liste = document.getElementById("liste");
  liste.innerHTML = "";
  if (!d.stand.length) liste.innerHTML = '<p class="leise">Noch nichts abgelegt.</p>';
  for (const e of [...d.stand].reverse()) {
    const k = document.createElement("div");
    k.className = "karte";
    const marken = document.createElement("div");
    marken.className = "marken";
    marken.append(marke(statusNamen[e.status] ?? e.status, e.status === "bestaetigt" ? "ok" : ""), marke("Version " + e.version), marke(e.rolle));
    if (e.offen.length) marken.append(marke("offen: " + e.offen.map((o) => offenNamen[o] ?? o).join(", "), "offen"));
    for (const h of e.hinweise ?? []) marken.append(marke(h, "offen"));
    k.append(marken);
    for (const [feld, a] of Object.entries(e.eintrag)) {
      const z = document.createElement("div");
      z.className = "zeile";
      const wert = feld === "projektId" ? (projekte[a.wert] ?? a.wert) : feld === "menge" ? `${a.wert.wert} ${a.wert.einheit}` : a.wert;
      const l = document.createElement("span");
      l.textContent = namen[feld] ?? feld;
      const r = document.createElement("span");
      r.textContent = wert;
      const zit = document.createElement("div");
      zit.className = "zitat";
      zit.textContent = `„${a.zitat}“`;
      r.append(zit);
      z.append(l, r);
      k.append(z);
    }
    const q = document.createElement("div");
    q.className = "quelle";
    q.textContent = "Quelle: " + e.quellen.map((n) => `[${n.art}] ${n.inhalt}`).join("\n");
    k.append(q);
    liste.append(k);
  }
  document.getElementById("kosten").textContent =
    d.kiWeg === "abo"
      ? `KI über dein Claude-Abo (zählt gegen das Abo-Limit). Zum Vergleich, zum API-Preis: ca. ${d.kostenUsd.toFixed(2)} USD`
      : `API-Kosten dieser Sitzung: ca. ${d.kostenUsd.toFixed(2)} USD`;
}
ladeBuero();
</script>
</body>
</html>
