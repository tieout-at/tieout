<title>Schlusswerk Bildschirme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f4f8;--surface:#ffffff;--surface-subtle:#fafafb;--surface-hover:#f0f0f4;--surface-selected:#e8e9ef;--line:#e6e6ec;--line-strong:#d4d4dc;--field-border:#838892;--text:#101112;--text-secondary:#3b4049;--text-muted:#5f656e;--text-disabled:#9ca1aa;--action:#242629;--action-hover:#101112;--on-action:#ffffff;--accent:#2563e0;--accent-soft:#e9f0fd;--on-accent:#ffffff;--pos:#13703f;--pos-soft:#e6f4ec;--warn:#935500;--warn-soft:#fcf1df;--neg:#b42318;--neg-soft:#fdecea;--law:#6438bd;--law-soft:#f1ecfb;--doc-paper:#ffffff;--doc-ink:#1b1c1f;--doc-viewer:#e9eaee;--doc-mark:#cfe0fc;--doc-mark-line:#2563e0;--doc-risk:#fcf1df;--doc-risk-line:#935500;--doc-line:#dfe1e6;--doc-ink-secondary:#4a4f58;--doc-muted:#5f656e;--doc-figure:#2b2f36;--doc-figure-soft:#e3e5e9;--shadow-overlay:0 8px 24px rgba(16,17,18,0.12), 0 0 0 1px rgba(16,17,18,0.06);--shadow-page:0 1px 3px rgba(16,17,18,0.16);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-full:9999px;--control-h:32px;--row-h:36px;--row-h-2:48px;--head-h:48px;--panel-head-h:44px;--chip-h:22px;--tab-h:28px;--sidebar-w:232px;--font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:"JetBrains Mono", ui-monospace, Consolas, monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#08090a;--surface:#0f1011;--surface-subtle:#141516;--surface-hover:#1a1b1d;--surface-selected:#222326;--line:#232425;--line-strong:#2e2e32;--field-border:#6b707a;--text:#f7f8f8;--text-secondary:#d0d6e0;--text-muted:#8f949d;--text-disabled:#5c6068;--action:#f7f8f8;--action-hover:#ffffff;--on-action:#08090a;--accent:#6d9cf8;--accent-soft:#16223a;--on-accent:#08090a;--pos:#4cc38a;--pos-soft:#0f2a1d;--warn:#e7a83e;--warn-soft:#2d2210;--neg:#f6786d;--neg-soft:#2f1512;--law:#b69cf2;--law-soft:#231a37;--doc-paper:#ffffff;--doc-ink:#1b1c1f;--doc-viewer:#050506;--doc-mark:#cfe0fc;--doc-mark-line:#2563e0;--doc-risk:#fcf1df;--doc-risk-line:#935500;--doc-line:#dfe1e6;--doc-ink-secondary:#4a4f58;--doc-muted:#5f656e;--doc-figure:#2b2f36;--doc-figure-soft:#e3e5e9;--shadow-overlay:0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);--shadow-page:0 1px 3px rgba(0,0,0,0.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08090a;--surface:#0f1011;--surface-subtle:#141516;--surface-hover:#1a1b1d;--surface-selected:#222326;--line:#232425;--line-strong:#2e2e32;--field-border:#6b707a;--text:#f7f8f8;--text-secondary:#d0d6e0;--text-muted:#8f949d;--text-disabled:#5c6068;--action:#f7f8f8;--action-hover:#ffffff;--on-action:#08090a;--accent:#6d9cf8;--accent-soft:#16223a;--on-accent:#08090a;--pos:#4cc38a;--pos-soft:#0f2a1d;--warn:#e7a83e;--warn-soft:#2d2210;--neg:#f6786d;--neg-soft:#2f1512;--law:#b69cf2;--law-soft:#231a37;--doc-paper:#ffffff;--doc-ink:#1b1c1f;--doc-viewer:#050506;--doc-mark:#cfe0fc;--doc-mark-line:#2563e0;--doc-risk:#fcf1df;--doc-risk-line:#935500;--doc-line:#dfe1e6;--doc-ink-secondary:#4a4f58;--doc-muted:#5f656e;--doc-figure:#2b2f36;--doc-figure-soft:#e3e5e9;--shadow-overlay:0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);--shadow-page:0 1px 3px rgba(0,0,0,0.6);color-scheme:dark}
.kpi{font-family:var(--font-sans);font-size:28px;line-height:32px;font-weight:600;letter-spacing:-0.02em;}
.page-title{font-family:var(--font-sans);font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.015em;}
.section-title{font-family:var(--font-sans);font-size:15px;line-height:22px;font-weight:600;letter-spacing:-0.01em;}
.body{font-family:var(--font-sans);font-size:14px;line-height:21px;font-weight:400;}
.ui{font-family:var(--font-sans);font-size:13px;line-height:20px;font-weight:400;letter-spacing:-0.01em;}
.ui-strong{font-family:var(--font-sans);font-size:13px;line-height:20px;font-weight:500;letter-spacing:-0.01em;}
.meta{font-family:var(--font-sans);font-size:12px;line-height:18px;font-weight:400;}
.label{font-family:var(--font-sans);font-size:11px;line-height:16px;font-weight:500;letter-spacing:0.06em;}
.mono{font-family:var(--font-mono);font-size:12px;line-height:18px;font-weight:400;}
/* Schlusswerk UI-Fundament: Bauteile. Jeder Farb-, Abstands- und Größenwert kommt aus tokens.css (tokens.json). */
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 13px; line-height: 20px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
.meta, .label, .mono { letter-spacing: normal; }
.label { text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.sw-pad { padding: var(--space-4); }
.sw-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.sw-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.sw-num { font-variant-numeric: tabular-nums; }
.sw-muted { color: var(--text-muted); }
.sw-secondary { color: var(--text-secondary); }
.sw-ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.sw-ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Knopf (Vorlage: reebuild r 6 / w500; Attio-Primärknopf in Tinte; Linear-Triage-Tasten) */
.sw-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--field-border); background: var(--surface); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.sw-btn:hover { background: var(--surface-hover); }
.sw-btn--primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
.sw-btn--primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
.sw-btn--ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.sw-btn--ghost:hover { background: var(--surface-hover); color: var(--text); }
.sw-btn--sm { height: var(--tab-h); padding: 0 var(--space-2); }
.sw-btn:disabled, .sw-btn[aria-disabled="true"] { color: var(--text-disabled); border-color: var(--line-strong); background: var(--surface); cursor: not-allowed; }
.sw-kbd { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 var(--space-1); border-radius: var(--radius-sm); border: 1px solid var(--field-border); font-family: var(--font-mono); font-size: 11px; line-height: 1; letter-spacing: normal; color: var(--text-muted); }
.sw-btn--primary .sw-kbd { border-color: currentColor; color: inherit; opacity: 0.75; }

/* Statusmarke (Vorlage: Linear-Labels: Pille mit Rand, farbiger Punkt, Text in normaler Farbe) */
.sw-chip { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--chip-h); padding: 0 var(--space-2); border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500; letter-spacing: normal; white-space: nowrap; }
.sw-chip::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--text-muted); flex: none; }
.sw-chip--pos::before { background: var(--pos); }
.sw-chip--warn::before { background: var(--warn); }
.sw-chip--neg::before { background: var(--neg); }
.sw-chip--law::before { background: var(--law); }
.sw-chip--plain::before { display: none; }

/* Stand eines Postens: Symbol + Wort ohne Rahmen (Linear-Statusspalte) */
.sw-status { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; font-weight: 500; letter-spacing: normal; color: var(--text-secondary); white-space: nowrap; }
.sw-status .sw-ico { width: 14px; height: 14px; color: var(--text-muted); }
.sw-status--done { color: var(--pos); }
.sw-status--done .sw-ico { color: var(--pos); }
.sw-status--law { color: var(--law); }
.sw-status--law .sw-ico { color: var(--law); }

/* Prüfstand (Vorlage: Rossum gelb = maschinell, grün = bestätigt, rot = blockiert) */
.sw-state { display: inline-flex; align-items: center; gap: var(--space-1); height: 20px; padding: 0 var(--space-1); border-radius: var(--radius-sm); font-size: 11px; font-weight: 500; letter-spacing: normal; white-space: nowrap; }
.sw-state .sw-ico { width: 12px; height: 12px; }
.sw-state--machine { background: var(--warn-soft); color: var(--warn); }
.sw-state--human { background: var(--pos-soft); color: var(--pos); }
.sw-state--blocked { background: var(--neg-soft); color: var(--neg); }

/* Risiko-Hinweis direkt am Betrag (Ramp: Status an der Zeile) */
.sw-risk { display: inline-flex; vertical-align: -2px; margin-left: var(--space-1); color: var(--warn); }
.sw-risk .sw-ico { width: 14px; height: 14px; }

/* Kennzahl (Vorlage: reebuild-Projektübersicht R-C: Label, Betrag, Kontextzeile) */
.sw-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }
.sw-kpi { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-4); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); min-width: 0; }
.sw-kpi .kpi { font-variant-numeric: tabular-nums; margin-top: var(--space-1); }
.sw-kpi__ctx { color: var(--text-secondary); }

/* Schrittleiste (Vorlage: reebuild-Ablauf; Kuro „x von y“) */
.sw-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); overflow: hidden; }
.sw-step { display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-right: 1px solid var(--line); min-width: 0; }
.sw-step:last-child { border-right: 0; }
.sw-step__n { width: 20px; height: 20px; flex: none; border-radius: var(--radius-full); display: grid; place-items: center; font-size: 11px; font-weight: 600; letter-spacing: normal; border: 1px solid var(--field-border); color: var(--text-muted); }
.sw-step--done .sw-step__n { background: var(--pos-soft); border-color: var(--pos-soft); color: var(--pos); }
.sw-step--done .sw-step__n .sw-ico { width: 12px; height: 12px; }
.sw-step--now .sw-step__n { background: var(--action); border-color: var(--action); color: var(--on-action); }
.sw-step__t { display: flex; flex-direction: column; min-width: 0; }
.sw-step__t b { font-weight: 500; }
.sw-step__t .meta { color: var(--text-muted); }

/* Panel (Kopf überall gleich hoch) */
.sw-panel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); overflow: hidden; min-width: 0; }
.sw-panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: var(--panel-head-h); padding: 0 var(--space-4); border-bottom: 1px solid var(--line); box-sizing: border-box; }
.sw-tabs { display: flex; gap: var(--space-1); }
.sw-tab { height: var(--tab-h); padding: 0 var(--space-2); border-radius: var(--radius-md); border: 0; background: transparent; color: var(--text-muted); font: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-1); }
.sw-tab:hover { color: var(--text); }
.sw-tab[aria-selected="true"] { background: var(--surface-selected); color: var(--text); }
.sw-count { color: var(--text-muted); font-weight: 400; font-variant-numeric: tabular-nums; }

/* Tabelle (Vorlage: reebuild R-B; Linear-Dichte und „Group by“; Hebbia-Herkunft; Siteline Eingabe vs. gerechnet) */
.sw-table { width: 100%; border-collapse: collapse; color: inherit; font: inherit; table-layout: auto; }
.sw-table th { text-align: left; padding: 0 var(--space-3); height: 32px; border-bottom: 1px solid var(--line); background: var(--surface-subtle); color: var(--text-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.sw-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.sw-table td.sw-td-2 { padding-top: 5px; padding-bottom: 5px; }
.sw-table tr:last-child td { border-bottom: 0; }
.sw-table .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sw-table .calc { color: var(--text-secondary); }
.sw-table tbody tr[data-open] { cursor: pointer; }
.sw-table tbody tr[data-open]:hover td { background: var(--surface-hover); }
.sw-table tbody tr[aria-selected="true"] td { background: var(--surface-selected); }
.sw-table tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sw-table .grp td { background: var(--surface-subtle); height: 32px; padding-top: 0; padding-bottom: 0; color: var(--text-secondary); font-weight: 500; }
.sw-table .grp td .sw-count { margin-left: var(--space-2); }
.sw-table .sum td { background: var(--surface-subtle); border-top: 1px solid var(--line-strong); font-weight: 600; }
.sw-cell { display: flex; flex-direction: column; min-width: 0; }
.sw-cell b { font-weight: 500; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-cell span { color: var(--text-muted); font-size: 12px; line-height: 16px; letter-spacing: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-pos-nr { font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: normal; color: var(--text-muted); margin-right: var(--space-2); }
.sw-origin { display: block; font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: normal; color: var(--text-muted); }

/* Beleg-Chip (Vorlage: Kuro-Fundstellen „Datei, S. 14“; Hebbia „+N“) */
.sw-source { display: inline-flex; align-items: center; gap: var(--space-1); align-self: flex-start; max-width: 100%; height: var(--chip-h); padding: 0 var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--field-border); background: var(--surface); color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; letter-spacing: normal; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-source .sw-ico { width: 12px; height: 12px; color: var(--text-muted); }
.sw-source:hover { color: var(--text); }
.sw-source[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.sw-source[aria-pressed="true"] .sw-ico { color: var(--accent); }
.sw-source--empty { border-style: dashed; color: var(--text-muted); cursor: default; font-family: var(--font-sans); font-size: 12px; }

/* Belegmatrix (Vorlage: Hebbia-Matrix, Harvey Review Table: Zeile = LV-Position, Spalte = Belegart, Zelle = Fundstelle) */
.sw-matrix td { vertical-align: top; }
.sw-matrix td .sw-source { margin: 1px 0; }
.sw-matrix td:not(:first-child) { display: table-cell; }
.sw-matrix td > .sw-source + .sw-source { margin-left: 0; }

/* Dokumentbetrachter (Vorlage: Kuro K-A Original mit Markierung und Seitenleiste; Rossum Rahmen) */
.sw-viewer { display: flex; flex-direction: column; background: var(--doc-viewer); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); overflow: hidden; min-width: 0; min-height: 0; }
.sw-viewer__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: var(--panel-head-h); padding: 0 var(--space-2) 0 var(--space-3); background: var(--surface); border-bottom: 1px solid var(--line); box-sizing: border-box; }
.sw-viewer__file { font-family: var(--font-mono); font-size: 12px; letter-spacing: normal; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-viewer__tools { display: flex; align-items: center; gap: var(--space-1); color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.sw-viewer__body { display: grid; grid-template-columns: minmax(0, 1fr) 84px; min-height: 0; flex: 1; }
.sw-viewer__canvas { padding: var(--space-5); overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
.sw-page { position: relative; width: 100%; max-width: 560px; background: var(--doc-paper); color: var(--doc-ink); box-shadow: var(--shadow-page); padding: var(--space-8); box-sizing: border-box; font-size: 13px; line-height: 1.6; letter-spacing: 0; transform-origin: top center; }
.sw-page__synth { position: absolute; top: var(--space-2); right: var(--space-3); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--doc-muted); border: 1px solid var(--doc-line); border-radius: var(--radius-sm); padding: 0 var(--space-1); }
.sw-page__head { display: grid; grid-template-columns: 64px 1fr; gap: 2px var(--space-3); font-size: 12px; padding-bottom: var(--space-3); margin-bottom: var(--space-3); border-bottom: 1px solid var(--doc-line); color: var(--doc-ink-secondary); }
.sw-page__head b { color: var(--doc-ink); font-weight: 600; }
.sw-page p { margin: 0 0 var(--space-3); }
.sw-mark { background: var(--doc-mark); box-shadow: inset 0 -2px 0 var(--doc-mark-line); }
.sw-mark--risk { background: var(--doc-risk); box-shadow: 0 0 0 2px var(--doc-risk-line); border-radius: 2px; }
.sw-doc-meta { color: var(--doc-ink-secondary); font-size: 12px; margin-bottom: var(--space-3); }
.sw-dt { width: 100%; border-collapse: collapse; font-size: 12px; color: var(--doc-ink); margin-top: var(--space-2); }
.sw-dt th, .sw-dt td { border: 1px solid var(--doc-line); padding: var(--space-1) var(--space-2); text-align: left; }
.sw-dt th { background: var(--doc-figure-soft); font-weight: 600; }
.sw-dt tr.hl td { background: var(--doc-mark); }
.sw-dt tr.sum td { font-weight: 600; }
.sw-sig { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-6); font-size: 12px; color: var(--doc-ink-secondary); }
.sw-sig > div { border-top: 1px solid var(--doc-figure); padding-top: var(--space-1); min-height: 32px; }
.sw-photo { aspect-ratio: 4 / 3; background: var(--doc-figure-soft); border: 1px solid var(--doc-line); display: grid; place-items: center; text-align: center; color: var(--doc-ink-secondary); font-size: 12px; }
.sw-viewer__rail { border-left: 1px solid var(--line); background: var(--surface); padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-3); overflow: auto; }
.sw-thumb { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); font-size: 11px; letter-spacing: normal; color: var(--text-muted); cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
.sw-thumb__page { width: 56px; height: 72px; background: var(--doc-paper); border: 1px solid var(--line-strong); border-radius: 2px; overflow: hidden; position: relative; }
.sw-thumb__page > .sw-page { position: absolute; top: 0; left: 0; width: 560px; max-width: none; transform: scale(0.1); transform-origin: top left; box-shadow: none; pointer-events: none; }
.sw-thumb[aria-current="true"] .sw-thumb__page { outline: 2px solid var(--accent); outline-offset: 1px; }
.sw-thumb[aria-current="true"] { color: var(--text); }

/* Beweiskette (Vorlage: Linear-Aktivität; Payapps-Verlauf je Nachtrag) */
.sw-chain { display: flex; flex-direction: column; }
.sw-ev { display: grid; grid-template-columns: 76px 16px minmax(0, 1fr); gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-md); cursor: pointer; }
.sw-ev:hover { background: var(--surface-hover); }
.sw-ev[aria-current="true"] { background: var(--surface-selected); }
.sw-ev__date { color: var(--text-muted); font-size: 12px; line-height: 20px; letter-spacing: normal; font-variant-numeric: tabular-nums; }
.sw-ev__rail { position: relative; }
.sw-ev__rail::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: var(--radius-full); border: 2px solid var(--field-border); background: var(--surface); box-sizing: border-box; }
.sw-ev[aria-current="true"] .sw-ev__rail::before { border-color: var(--accent); background: var(--accent); }
.sw-ev__rail::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: -16px; width: 2px; background: var(--line); }
.sw-ev:last-child .sw-ev__rail::after { display: none; }
.sw-ev__body { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; align-items: flex-start; }
.sw-ev__body b { font-weight: 500; }
.sw-ev__body > span { color: var(--text-secondary); font-size: 12px; line-height: 16px; letter-spacing: normal; }

/* Freigabeleiste (Vorlage: Linear-Triage 1/2/3/H; reebuild-Freigabe: Stufen mit Person und Zeit) */
.sw-decide { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface); border-top: 1px solid var(--line-strong); }

 '<div class="sw-panel tw"><div class="sw-panel__head"><span class="section-title">Befunde</span><div class="sw-tabs" role="tablist">'+tabs.map(function(t){return '<button class="sw-tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===cur[0])+'">'+t[1]+' <span class="sw-count">'+t[2]+'</span></button>'}).join("")+'</div></div>'+
 C.befundTable(st.stand,cur[3],st.sel)+'</div></div>';
}
function ordner(){
 return '<div class="scr-body"><p class="lead body">165 Dokumente, davon 12 Duplikate. Jede LV-Position ist mit ihren Belegen verbunden: Klick auf einen Beleg öffnet das Original.</p>'+
 '<div class="sw-panel tw"><div class="sw-panel__head"><span class="section-title">Belegmatrix</span><span class="meta sw-muted">Auszug: 5 von 380 Positionen</span></div>'+C.matrix()+'</div>'+
 '<div class="sw-panel"><div class="sw-panel__head"><span class="section-title">Upload vom 22.10.2026, 09:14</span><span class="meta sw-muted">3 Planindizes · 12 Duplikate · 1 Korrekturblatt</span></div><div class="sw-pad">'+C.upload()+'</div></div></div>';
}
function decideBar(f){
 var s=st.stand[f.id], last=s.log[s.log.length-1];
 var who=last?'<span>'+last[0]+'</span>'+C.person(last[1])+'<span>'+last[2]+'</span>':'<span>Noch nicht entschieden.</span>';
 var btn;
 if(f.liste==="anwalt"){btn='<span class="meta sw-secondary">Hinweis ohne Betrag. Würdigung nur durch den Anwalt, Schlusswerk bewertet nicht.</span>';}
 else if(s.st==="pruefen"||s.st==="zurueck"){
  btn=st.reasons?'<div class="sw-stack" style="gap:var(--space-2)"><span class="meta sw-secondary">Grund für „Verwerfen“:</span><div class="sw-reasons">'+C.GRUENDE.map(function(g){return '<button class="sw-reason" data-reason="'+g+'">'+g+'</button>'}).join("")+'<button class="sw-btn sw-btn--ghost sw-btn--sm" data-reason="">Abbrechen</button></div></div>':
  '<div class="sw-row"><button class="sw-btn sw-btn--primary" data-dec="uebernommen">Übernehmen <span class="sw-kbd">1</span></button><button class="sw-btn" data-dec="verwerfen">Verwerfen <span class="sw-kbd">2</span></button><button class="sw-btn" data-dec="anwalt">'+I("scale")+'Braucht Anwalt <span class="sw-kbd">3</span></button><button class="sw-btn sw-btn--ghost" data-dec="zurueck">Zurückstellen <span class="sw-kbd">H</span></button></div>';
 } else if(s.st==="uebernommen"){
  btn='<div class="sw-row"><button class="sw-btn sw-btn--primary" data-dec="frei">Freigeben als Insider <span class="sw-kbd">F</span></button><button class="sw-btn" data-dec="pruefen">Zurück an Prüfung</button></div>';
 } else {
  btn='<div class="sw-row"><button class="sw-btn" data-dec="pruefen">Wieder öffnen</button></div>';
 }
 return '<div class="sw-decide">'+btn+'<div class="sw-decide__line">'+C.standHtml(s)+who+(s.st==="uebernommen"?'<span class="sw-muted">· wartet auf Freigabe durch</span>'+C.person("I"):"")+(s.grund?'<span class="sw-muted">· Grund: '+s.grund+'</span>':"")+'</div></div>';
}
function befund(){
 var f=byId(st.sel), doc=st.doc||f.doc, d=C.D[doc], keys=f.belege.map(function(b){return b[1]}), ix=keys.indexOf(doc);
 var calc=f.calc.length?'<div class="sw-panel"><table class="sw-table"><tbody>'+f.calc.map(function(c){return '<tr><td>'+c[0]+'<span class="sw-origin">'+(c[2]||"")+'</span></td><td class="r">'+c[1]+'</td><td style="width:110px">'+(c[3]==="machine"?'<span class="sw-state sw-state--machine">'+I("bot")+'Maschinell</span>':c[3]==="human"?'<span class="sw-state sw-state--human">'+I("user-check")+'Bestätigt</span>':"")+'</td></tr>'}).join("")+'<tr class="sum"><td colspan="3">'+f.sum+'</td></tr></tbody></table></div>':'<p class="meta sw-secondary" style="margin:0">'+f.sum+'</p>';
 var L=C.LISTEN.filter(function(l){return l[0]===f.liste})[0];
 return '<div class="split"><div class="split-left"><div class="split-scroll">'+
 '<div class="fhead"><div class="sw-row"><span class="sw-chip'+(L[2]?" sw-chip--"+L[2]:"")+'">'+L[1]+'</span><span class="meta sw-muted">'+f.art+(f.hinweis?" · Mengenänderung "+f.hinweis:"")+'</span></div><h1 class="section-title">'+(f.nr?'<span class="sw-pos-nr">'+f.nr+'</span>':"")+f.kurz+'</h1>'+(f.cent!==null?'<span class="kpi">'+euro(f.cent)+'</span>':"")+'</div>'+
 (f.risiko?'<div class="callout">'+I("alert")+'<div><b>Kürzungsrisiko aus GU-Sicht</b>'+f.risiko+'</div></div>':"")+
 (f.hinweis?'<div class="callout" style="background:var(--surface-subtle)">'+I("alert")+'<div><b style="color:var(--text-secondary)">Mengenänderung über 20 % ('+f.hinweis+')</b>Der GU kann hier einen neuen Einheitspreis prüfen. <span class="sw-muted">(Annahme zur ÖNORM B 2110, Insider prüft)</span></div></div>':"")+
 calc+
 '<div class="sw-stack" style="gap:var(--space-2)"><span class="label">Beweiskette · '+f.belege.length+(f.belege.length===1?" Beleg":" Belege")+'</span><div class="sw-chain">'+f.belege.map(function(b){var dd=C.D[b[1]];return '<div class="sw-ev" data-doc="'+b[1]+'"'+(doc===b[1]?' aria-current="true"':"")+'><span class="sw-ev__date">'+b[0]+'</span><span class="sw-ev__rail"></span><div class="sw-ev__body"><b>'+b[2]+'</b><span>'+b[3]+'</span><button class="sw-source"'+(doc===b[1]?' aria-pressed="true"':"")+'>'+I(dd.icon)+dd.file+(dd.page.indexOf("/")>0?" · "+dd.page.split(" /")[0]:"")+'</button></div></div>'}).join("")+'</div></div>'+
 '</div>'+decideBar(f)+'</div>'+
 '<div class="split-right"><div class="sw-viewer"><div class="sw-viewer__bar"><span class="sw-viewer__file">'+d.file+'</span><div class="sw-viewer__tools"><button class="sw-btn sw-btn--ghost sw-btn--sm" data-step="-1" aria-label="Voriger Beleg"'+(ix<=0?" disabled":"")+'>'+I("chevron-left")+'</button><span>'+d.page+'</span><button class="sw-btn sw-btn--ghost sw-btn--sm" data-step="1" aria-label="Nächster Beleg"'+(ix>=keys.length-1?" disabled":"")+'>'+I("chevron-right")+'</button><button class="sw-btn sw-btn--ghost sw-btn--sm" data-zoom="-10" aria-label="Verkleinern">'+I("zoom-out")+'</button><span class="zoom">'+st.zoom+' %</span><button class="sw-btn sw-btn--ghost sw-btn--sm" data-zoom="10" aria-label="Vergrößern">'+I("zoom-in")+'</button></div></div>'+
 '<div class="sw-viewer__body"><div class="sw-viewer__canvas"><div style="width:100%;max-width:560px;transform:scale('+(st.zoom/100)+');transform-origin:top center">'+C.page(doc)+'</div></div><div class="sw-viewer__rail">'+f.belege.map(function(b){return '<button class="sw-thumb" data-doc="'+b[1]+'"'+(doc===b[1]?' aria-current="true"':"")+'><span class="sw-thumb__page">'+C.page(b[1])+'</span>'+C.D[b[1]].label+'</button>'}).join("")+'</div></div></div></div></div>';
}
function vorpruefung(){
 return '<div class="scr-body"><p class="lead body">4 Positionen mit Kürzungsrisiko: <b>8.767,50 €</b>, davon 2 bereits in AR3 gekürzt (2.196,00 €). Bei 1 Abzug des GU ist kein Vertragspunkt zu finden.</p>'+
 '<div class="sw-panel tw"><div class="sw-panel__head"><span class="section-title">Positionen mit Kürzungsrisiko</span><span class="meta sw-muted">Grund aus fester Liste</span></div>'+C.vorpruefTable()+'</div>'+
 '<div class="sw-panel"><div class="sw-panel__head"><span class="section-title">Hinweise ohne Betrag</span><span class="meta sw-muted">Annahme zur ÖNORM B 2110, Insider prüft</span></div>'+
 [["24.02.05A","Mehrschicht-Verbundrohr","+26,9 %","J5"],["22.06.03C","Rohrdämmung 13 mm","+26,7 %","J6"],["26.03.04A","Wickelfalzrohr DN 200","+36,2 %","J7"]].map(function(h){return '<div class="hint">'+I("alert")+'<div><b style="font-weight:500"><span class="sw-pos-nr">'+h[0]+'</span>'+h[1]+': Mengenänderung '+h[2]+'</b><br><span>Der GU kann hier einen neuen Einheitspreis prüfen.</span></div></div>'}).join("")+'</div>'+
 '<div class="sw-panel tw"><div class="sw-panel__head"><span class="section-title">Schlussrechnung aus GU-Sicht</span><span class="meta sw-muted">Bauvertrag vom 14.11.2025</span></div>'+C.cascade(st.arOpen)+'</div></div>';
}
function render(){
 if(VIEWS.indexOf(st.view)<0)st.view="cockpit";
 document.getElementById("side").outerHTML=C.sidebar(st.view==="befund"?"befunde":st.view).replace('<aside class="sw-sidebar">','<aside class="sw-sidebar" id="side">');
 document.getElementById("head").innerHTML=head();
 var v=document.getElementById("view");
 v.innerHTML=st.view==="cockpit"?cockpit():st.view==="befunde"?befunde():st.view==="befund"?befund():st.view==="ordner"?ordner():vorpruefung();
 S.mount();
}
var tt=null;
function toast(msg){var t=document.getElementById("toast");t.innerHTML='<div class="sw-toast" role="status">'+msg+'<button id="undo">'+I("undo")+'Rückgängig</button></div>';t.hidden=false;S.mount(t);clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},5000)}
function setStand(id,neu,grund){
 var s=st.stand[id];st.undo.push([id,JSON.parse(JSON.stringify(s))]);
 var wer=neu==="frei"?"I":"M", wort={uebernommen:"Übernommen",frei:"Freigegeben",verworfen:"Verworfen",anwalt:"Braucht Anwalt",zurueck:"Zurückgestellt",pruefen:"Wieder geöffnet"}[neu];
 s.st=neu==="verworfen"?"verworfen":neu;s.grund=grund||null;s.log=s.log.concat([[wort,wer,now()]]);
 st.reasons=false;render();var f=byId(id);toast(wort+": "+(f.nr?f.nr+" ":"")+f.kurz);
}
function go(hash){var h=(hash||"").replace("#","");if(h==="theme")return;if(VIEWS.indexOf(h)>=0){st.view=h;render()}}
window.addEventListener("hashchange",function(){go(location.hash)});
document.addEventListener("click",function(e){
 var a=e.target.closest("a[href^='#']");
 if(a){e.preventDefault();if(a.getAttribute("aria-disabled")==="true")return;var h=a.getAttribute("href").slice(1);
  if(h==="theme"){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";return}
  st.view=h;render();return}
 var o=e.target.closest("[data-open]");if(o){st.sel=o.dataset.open;st.doc=null;st.zoom=100;st.reasons=false;st.view="befund";render();return}
 var src=e.target.closest("[data-src]");if(src){var key=src.dataset.src,hit=C.F.filter(function(f){return f.belege.some(function(b){return b[1]===key})})[0];if(hit){st.sel=hit.id;st.doc=key;st.view="befund";render()}return}
 var k=e.target.closest("[data-doc]");if(k){st.doc=k.dataset.doc;render();return}
 var tb=e.target.closest("[data-tab]");if(tb){st.tab=tb.dataset.tab;render();return}
 var stp=e.target.closest("[data-step]");if(stp){var f=byId(st.sel),keys=f.belege.map(function(b){return b[1]}),i=keys.indexOf(st.doc||f.doc)+(+stp.dataset.step);if(i>=0&&i<keys.length){st.doc=keys[i];render()}return}
 var z=e.target.closest("[data-zoom]");if(z){st.zoom=Math.max(60,Math.min(150,st.zoom+(+z.dataset.zoom)));render();return}
 var tg=e.target.closest("[data-toggle]");if(tg){st.arOpen=!st.arOpen;render();return}
 var d=e.target.closest("[data-dec]");if(d){var dec=d.dataset.dec;if(dec==="verwerfen"){st.reasons=true;render();return}setStand(st.sel,dec);return}
 var rs=e.target.closest("[data-reason]");if(rs){if(!rs.dataset.reason){st.reasons=false;render();return}setStand(st.sel,"verworfen",rs.dataset.reason);return}
 if(e.target.closest("#undo")){var u=st.undo.pop();if(u){st.stand[u[0]]=u[1];render()}document.getElementById("toast").hidden=true;return}
});
document.addEventListener("keydown",function(e){
 if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
 var t=e.target;
 if(t.closest&&t.closest("input,textarea"))return;
 if(e.key==="Enter"&&t.matches&&t.matches("tr[data-open],tr[data-toggle]")){e.preventDefault();t.click();return}
 if((e.key==="j"||e.key==="k")&&document.querySelector("tr[data-open]")){var rows=[].slice.call(document.querySelectorAll("tr[data-open]")),i=rows.indexOf(document.activeElement);i=e.key==="j"?Math.min(rows.length-1,i+1):Math.max(0,i-1);rows[i].focus();return}
 if(st.view!=="befund")return;
 var s=st.stand[st.sel].st,f=byId(st.sel);if(f.liste==="anwalt")return;
 if((s==="pruefen"||s==="zurueck")&&!st.reasons){if(e.key==="1")setStand(st.sel,"uebernommen");if(e.key==="2"){st.reasons=true;render()}if(e.key==="3")setStand(st.sel,"anwalt");if(e.key==="h"||e.key==="H")setStand(st.sel,"zurueck")}
 else if(s==="uebernommen"&&(e.key==="f"||e.key==="F"))setStand(st.sel,"frei");
});
try{var h0=location.hash.replace("#","");if(VIEWS.indexOf(h0)>=0)st.view=h0}catch(e){}
render();
})();
</script>
